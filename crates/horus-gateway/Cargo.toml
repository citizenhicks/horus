[package]
name = "horus-gateway"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Headless authenticated gateway for Horus frontends"
license = "Apache-2.0"
repository = "https://github.com/citizenhicks/horus"
readme = "README.md"
publish = ["crates-io"]
keywords = ["agent", "ai", "gateway", "llm", "server"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "horus_gateway"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
croner = "3"
horus = { version = "=0.2.0", path = "../.." }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[lints]
workspace = true
