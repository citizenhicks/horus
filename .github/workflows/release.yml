name: Release

on:
  push:
    tags:
      - horus-v*
      - horus-cli-v*

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - name: Check Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: cargo test --workspace --all-targets --all-features --locked

  publish-framework:
    name: Publish horus
    if: startsWith(github.ref_name, 'horus-v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#horus-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "horus") | .version')"
          test "$version" = "$manifest_version"
      - name: Publish
        run: cargo publish --locked -p horus
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli:
    name: Publish horus-cli
    if: startsWith(github.ref_name, 'horus-cli-v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#horus-cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "horus-cli") | .version')"
          test "$version" = "$manifest_version"
      - name: Publish
        run: cargo publish --locked -p horus-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  cli-binaries:
    name: CLI binary (${{ matrix.os }})
    if: startsWith(github.ref_name, 'horus-cli-v')
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#horus-cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "horus-cli") | .version')"
          test "$version" = "$manifest_version"
      - run: cargo build --release --locked -p horus-cli
      - name: Package binary
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${GITHUB_REF_NAME#horus-cli-v}"
          archive="horus-${version}-${host}.tar.gz"
          mkdir dist package
          cp target/release/horus LICENSE NOTICE package/
          tar -C package -czf "dist/$archive" horus LICENSE NOTICE
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  framework-release:
    name: Framework GitHub release
    if: startsWith(github.ref_name, 'horus-v')
    needs: publish-framework
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#horus-v}"
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "Horus $version" \
            --verify-tag

  cli-release:
    name: CLI GitHub release
    if: startsWith(github.ref_name, 'horus-cli-v')
    needs:
      - publish-cli
      - cli-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#horus-cli-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --title "Horus CLI $version" \
            --verify-tag
